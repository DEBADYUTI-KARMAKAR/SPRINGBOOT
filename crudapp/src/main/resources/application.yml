spring:
  application:
    name: crudapp

  datasource:
    username: root
    password: demo
    url: jdbc:mysql://localhost:3306/sbmscrud
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  mvc:
    pathmatch:
      matching-strategy: ANT_PATH_MATCHER